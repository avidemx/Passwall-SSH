name: Build Passwall-SSH Multi-Arch

on:
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read_version.outputs.version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Read version from file
      id: read_version
      run: |
        VER_FILE="VERSION"
        VERSION=$(tr -d ' \r\n' < "$VER_FILE")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Target Release Version: $VERSION"

  build:
    needs: [setup, test-dnstt-client]
    name: Build OpenWrt ${{ matrix.owrt.major }} (${{ matrix.arch_item.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APP_VERSION: ${{ needs.setup.outputs.version }}

    strategy:
      fail-fast: false
      matrix:
        owrt:
          - version: "24.10.8"
            major: "24"
            ext: "ipk"
            url_prefix: "https://downloads.openwrt.org/releases/24.10.8/targets"
          - version: "25.12.5"
            major: "25"
            ext: "apk"
            url_prefix: "https://downloads.openwrt.org/releases/25.12.5/targets"
        arch_item:
          - target: "ramips"
            subtarget: "mt7621"
            arch: "mipsel_24kc"
            goarch: "mipsle"
            gomips: "softfloat"
            goarm: ""
            go386: ""
          - target: "ath79"
            subtarget: "generic"
            arch: "mips_24kc"
            goarch: "mips"
            gomips: "softfloat"
            goarm: ""
            go386: ""
          - target: "sunxi"
            subtarget: "cortexa53"
            arch: "aarch64_cortex-a53"
            goarch: "arm64"
            gomips: ""
            goarm: ""
            go386: ""
          - target: "rockchip"
            subtarget: "armv8"
            arch: "aarch64_generic"
            goarch: "arm64"
            gomips: ""
            goarm: ""
            go386: ""
          - target: "sunxi"
            subtarget: "cortexa7"
            arch: "arm_cortex-a7"
            goarch: "arm"
            gomips: ""
            goarm: "7"
            go386: ""
          - target: "sunxi"
            subtarget: "cortexa7"
            arch: "arm_cortex-a7_neon-vfpv4"
            goarch: "arm"
            gomips: ""
            goarm: "7"
            go386: ""
          - target: "mvebu"
            subtarget: "cortexa9"
            arch: "arm_cortex-a9"
            goarch: "arm"
            gomips: ""
            goarm: "7"
            go386: ""
          - target: "x86"
            subtarget: "64"
            arch: "x86_64"
            goarch: "amd64"
            gomips: ""
            goarm: ""
            go386: ""
          - target: "x86"
            subtarget: "generic"
            arch: "i386_pentium4"
            goarch: "386"
            gomips: ""
            goarm: ""
            go386: "sse2"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang flex bison gawk gettext git \
          libncurses-dev libssl-dev python3 rsync unzip wget zstd

    - name: Sync App Version to Repository Makefile
      run: |
        echo "Building Passwall-SSH with version: $APP_VERSION"
        MAKEFILE="package/passwall-ssh/Makefile"
        if [ -f "$MAKEFILE" ]; then
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$APP_VERSION/" "$MAKEFILE"
          echo "Updated $MAKEFILE to $APP_VERSION"
        fi

    - name: Download OpenWrt SDK
      run: |
        SDK_BASE="${{ matrix.owrt.url_prefix }}/${{ matrix.arch_item.target }}/${{ matrix.arch_item.subtarget }}/"
        SDK_FILE=$(wget -qO- "$SDK_BASE" | grep -o 'openwrt-sdk[^"]*Linux-x86_64.tar.zst' | head -n1)
        wget "${SDK_BASE}${SDK_FILE}"

    - name: Extract SDK
      run: |
        tar --zstd -xf openwrt-sdk-*.tar.zst
        SDK_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*")
        mv "$SDK_DIR" sdk

    - name: Restore dl cache
      uses: actions/cache@v4
      with:
        path: sdk/dl
        key: dl-${{ matrix.owrt.major }}-${{ matrix.arch_item.arch }}

    - name: Copy packages to SDK
      run: |
        cp -a package/badvpn sdk/package/
        cp -a package/passwall-ssh sdk/package/
    
    - name: Set up Go for DNSTT client
      uses: actions/setup-go@v5
      with:
        go-version: "1.24.4"
        cache: true
        cache-dependency-path: go-dnstt/go.sum

    - name: Configure SDK & Set Version
      working-directory: sdk
      run: |
        # Update versi langsung di dalam SDK
        sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$APP_VERSION/" package/passwall-ssh/Makefile
        sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" package/passwall-ssh/Makefile
        
        echo "CONFIG_PACKAGE_badvpn-tun2socks=y" >> .config
        echo "CONFIG_PACKAGE_passwall-ssh=y" >> .config
        make defconfig

    - name: 1. Compile BadVPN
      working-directory: sdk
      run: |
        make package/badvpn/{clean,compile} -j$(nproc) V=s

    - name: 2. Inject BadVPN into Passwall-SSH
      working-directory: sdk
      run: |
        BIN_PATH=$(find build_dir/ -path "*/usr/bin/badvpn-tun2socks" -type f | head -n 1)
        if [ -z "$BIN_PATH" ]; then
          BIN_PATH=$(find build_dir/ -name "badvpn-tun2socks" -type f | grep -v "/CMakeFiles/" | head -n 1)
        fi
        if [ -z "$BIN_PATH" ]; then
          echo "Error: badvpn-tun2socks binary not found!"
          exit 1
        fi
        mkdir -p package/passwall-ssh/files/usr/bin/
        mkdir -p package/passwall-ssh/files/usr/share/passwall-ssh/
        cp "$BIN_PATH" package/passwall-ssh/files/usr/bin/badvpn-tun2socks
        chmod +x package/passwall-ssh/files/usr/bin/badvpn-tun2socks
        
        echo "$APP_VERSION" \
        > package/passwall-ssh/files/usr/share/passwall-ssh/version

    - name: 2b. Build and inject patched DNSTT client
      working-directory: go-dnstt
      env:
        GOOS: linux
        GOARCH: ${{ matrix.arch_item.goarch }}
        CGO_ENABLED: "0"
        GOARM: ${{ matrix.arch_item.goarm }}
        GOMIPS: ${{ matrix.arch_item.gomips }}
        GO386: ${{ matrix.arch_item.go386 }}
      run: |
        set -euo pipefail
        BIN="$GITHUB_WORKSPACE/sdk/package/passwall-ssh/files/usr/bin/dnstt-client"
        mkdir -p "$(dirname "$BIN")"

        echo "Building patched DNSTT client for OpenWrt ${{ matrix.arch_item.arch }}"
        echo "Go target: GOOS=$GOOS GOARCH=$GOARCH GOARM=${GOARM:-default} GOMIPS=${GOMIPS:-default} GO386=${GO386:-default}"
        go version
        go build -trimpath -buildvcs=false -ldflags="-s -w" -o "$BIN" ./dnstt-client

        test -s "$BIN"
        chmod 0755 "$BIN"
        file "$BIN"
        readelf -h "$BIN" | grep -E 'Class:|Machine:'
        sha256sum "$BIN"
        ls -lh "$BIN"

    - name: 3. Compile Passwall-SSH
      working-directory: sdk
      run: |
        make package/passwall-ssh/{clean,compile} -j$(nproc) V=s

    - name: Prepare Release Artifacts
      run: |
        mkdir -p release
        PKG=$(find sdk/bin/packages/ -name "passwall-ssh*.${{ matrix.owrt.ext }}" 2>/dev/null | head -n 1)
        if [ -z "$PKG" ]; then
          PKG=$(find sdk/bin/ -name "passwall-ssh*.${{ matrix.owrt.ext }}" | head -n 1)
        fi
        if [ -z "$PKG" ]; then
          echo "Error: file passwall-ssh*.${{ matrix.owrt.ext }} tidak ditemukan!"
          exit 1
        fi
        CUSTOM_NAME="passwall-ssh_${{ matrix.owrt.major }}_${APP_VERSION}_${{ matrix.arch_item.arch }}.${{ matrix.owrt.ext }}"
        cp "$PKG" "release/$CUSTOM_NAME"
        echo "Generated package: $CUSTOM_NAME"
        ls -lh release/

    - name: Upload Artifacts per Matrix
      uses: actions/upload-artifact@v4
      with:
        name: passwall-${{ matrix.owrt.major }}-${{ matrix.arch_item.arch }}
        path: release/*


  test-dnstt-client:
    name: Test patched HTTP Custom DNSTT client
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.24.4"
        cache: true
        cache-dependency-path: go-dnstt/go.sum

    - name: Test Go source and HTTP Custom implementation
      working-directory: go-dnstt
      run: |
        set -euo pipefail
        go version
        go mod verify
        go test ./...
        go vet ./dns ./dnstt-client ./turbotunnel

    - name: Build and smoke-test native dnstt-client
      working-directory: go-dnstt
      run: |
        set -euo pipefail
        mkdir -p dist
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -trimpath -buildvcs=false -ldflags="-s -w" \
          -o dist/dnstt-client-linux-amd64 ./dnstt-client
        dist/dnstt-client-linux-amd64 -help > dist/dnstt-client-help.txt 2>&1 || true
        grep -E -- '-httpcustom|-qtype|-udp|-pubkey-file' dist/dnstt-client-help.txt
        file dist/dnstt-client-linux-amd64
        sha256sum dist/dnstt-client-linux-amd64
        
  release:
    needs: [setup, build]
    runs-on: ubuntu-24.04
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-artifacts
        merge-multiple: true

    - name: Display downloaded files
      run: ls -lh all-artifacts/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.setup.outputs.version }}
        name: Passwall-SSH v${{ needs.setup.outputs.version }}
        body: |
          # STABIL - Optimal Performance 🚀

          * Perbaikan beberapa bug.
          ---
          ### Arsitektur & Versi yang Tersedia:
          - **OpenWrt 24.x** (\`.ipk\`)
          - **OpenWrt 25.x** (\`.apk\`)

        draft: false
        prerelease: false
        make_latest: true
        overwrite_files: false
        files: all-artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
