name: Build Passwall-SSH (OpenWrt 24 & 25)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for OpenWrt ${{ matrix.owrt }} (${{ matrix.ext }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    # Menggunakan Matrix Strategy untuk memproses 2 versi OpenWrt secara paralel
    strategy:
      fail-fast: false
      matrix:
        include:
          - owrt: "24.10"
            sdk_url: "https://downloads.openwrt.org/releases/24.10.0/targets/ramips/mt7621/"
            ext: "ipk"
          - owrt: "25.12"
            sdk_url: "https://downloads.openwrt.org/releases/25.12.0/targets/ramips/mt7621/"
            ext: "apk"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang flex bison gawk gettext git \
          libncurses-dev libssl-dev python3 rsync unzip wget zstd

    - name: Download OpenWrt SDK (${{ matrix.owrt }})
      run: |
        SDK_FILE=$(wget -qO- "${{ matrix.sdk_url }}" | grep -o 'openwrt-sdk[^"]*Linux-x86_64.tar.zst' | head -n1)
        wget "${{ matrix.sdk_url }}${SDK_FILE}"

    - name: Extract SDK
      run: |
        tar --zstd -xf openwrt-sdk-*.tar.zst
        SDK_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*")
        mv "$SDK_DIR" sdk

    - name: Restore dl cache
      uses: actions/cache@v4
      with:
        path: sdk/dl
        key: dl-openwrt-${{ matrix.owrt }}

    - name: Copy packages to SDK
      run: |
        cp -a package/badvpn sdk/package/
        cp -a package/passwall-ssh sdk/package/

    - name: Configure SDK
      working-directory: sdk
      run: |
        echo "CONFIG_PACKAGE_badvpn-tun2socks=y" >> .config
        echo "CONFIG_PACKAGE_passwall-ssh=y" >> .config
        make defconfig

    - name: 1. Compile BadVPN
      working-directory: sdk
      run: |
        make package/badvpn/{clean,compile} -j$(nproc) V=s

    - name: 2. Inject BadVPN into Passwall-SSH
      working-directory: sdk
      run: |
        BIN_PATH=$(find build_dir/ -path "*/usr/bin/badvpn-tun2socks" -type f | head -n 1)
        if [ -z "$BIN_PATH" ]; then
          BIN_PATH=$(find build_dir/ -name "badvpn-tun2socks" -type f | grep -v "/CMakeFiles/" | head -n 1)
        fi
        if [ -z "$BIN_PATH" ]; then
          echo "Error: badvpn-tun2socks binary not found!"
          exit 1
        fi
        mkdir -p package/passwall-ssh/files/usr/bin/
        cp "$BIN_PATH" package/passwall-ssh/files/usr/bin/badvpn-tun2socks
        chmod +x package/passwall-ssh/files/usr/bin/badvpn-tun2socks

    - name: 3. Compile Passwall-SSH (${{ matrix.ext }})
      working-directory: sdk
      run: |
        make package/passwall-ssh/{clean,compile} -j$(nproc) V=s

    - name: Prepare Release Artifacts
      run: |
        mkdir -p release
        
        # Cari file hasil build berdasarkan ekstensinya (.ipk atau .apk)
        PKG=$(find sdk/bin/packages/ -name "passwall-ssh*.${{ matrix.ext }}" | head -n 1)
        if [ -z "$PKG" ]; then
          echo "Error: file passwall-ssh*.${{ matrix.ext }} tidak ditemukan!"
          exit 1
        fi
        
        # Beri penamaan file yang jelas agar tidak tertukar di Release
        FILENAME=$(basename "$PKG")
        cp "$PKG" "release/passwall-ssh-openwrt${{ matrix.owrt }}_${FILENAME}"
        ls -lh release/

    - name: Upload Artifacts per Matrix
      uses: actions/upload-artifact@v4
      with:
        name: passwall-ssh-openwrt-${{ matrix.owrt }}
        path: release/*

  # Job kedua untuk menggabungkan dan merilis keduanya secara bersamaan
  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-artifacts
        merge-multiple: true

    - name: Display downloaded files
      run: ls -lh all-artifacts/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Passwall-SSH (OpenWrt 24 & 25 Support)
        body: |
          ### Versi yang Tersedia:
          - **Passwall-SSH for OpenWrt 24.x** (`.ipk`)
          - **Passwall-SSH for OpenWrt 25.x** (`.apk`)
          
          *Sudah termasuk built-in BadVPN-Tun2Socks.*
        draft: false
        prerelease: false
        make_latest: true
        overwrite_files: true
        files: all-artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
