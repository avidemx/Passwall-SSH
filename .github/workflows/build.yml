name: Build Passwall-SSH with Built-in BadVPN

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  OPENWRT_VERSION: "25.12.5"
  TARGET: "ramips"
  SUBTARGET: "mt7621"
  ARCH: "mipsel_24kc"

jobs:
  build:
    name: Compile BadVPN & Build Passwall-SSH
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang flex bison gawk gettext git \
          libncurses-dev libssl-dev python3 rsync unzip wget zstd

    - name: Download OpenWrt SDK
      run: |
        SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}/"
        SDK_FILE=$(wget -qO- "$SDK_URL" | grep -o 'openwrt-sdk[^"]*Linux-x86_64.tar.zst' | head -n1)
        wget "${SDK_URL}${SDK_FILE}"

    - name: Extract SDK
      run: |
        tar --zstd -xf openwrt-sdk-*.tar.zst
        SDK_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*")
        mv "$SDK_DIR" sdk

    - name: Restore dl cache
      uses: actions/cache@v4
      with:
        path: sdk/dl
        key: dl-${{ env.OPENWRT_VERSION }}

    - name: Copy packages to SDK
      run: |
        # Mengcopy folder badvpn dan passwall-ssh ke dalam SDK
        cp -a package/badvpn sdk/package/
        cp -a package/passwall-ssh sdk/package/

    - name: Configure SDK
      working-directory: sdk
      run: |
        echo "CONFIG_PACKAGE_badvpn-tun2socks=y" >> .config
        echo "CONFIG_PACKAGE_passwall-ssh=y" >> .config
        make defconfig

    - name: 1. Compile BadVPN
      working-directory: sdk
      run: |
        echo "Compiling BadVPN Tun2Socks..."
        make package/badvpn/{clean,compile} -j$(nproc) V=s

    - name: 2. Inject BadVPN into Passwall-SSH
      working-directory: sdk
      run: |
        echo "Finding compiled badvpn-tun2socks binary..."
        
        # Debugging: tampilkan semua file badvpn-tun2socks yang berhasil dibuat
        echo "Daftar binary yang ditemukan di build_dir:"
        find build_dir/ -name "badvpn-tun2socks" -type f
        
        # 1. Coba cari di dalam struktur usr/bin (biasanya file yang sudah siap pakai / stripped)
        BIN_PATH=$(find build_dir/ -path "*/usr/bin/badvpn-tun2socks" -type f | head -n 1)
        
        # 2. Jika tidak ketemu, ambil langsung binary hasil kompilasi CMake
        if [ -z "$BIN_PATH" ]; then
          BIN_PATH=$(find build_dir/ -name "badvpn-tun2socks" -type f | grep -v "/CMakeFiles/" | head -n 1)
        fi
        
        # 3. Validasi akhir
        if [ -z "$BIN_PATH" ]; then
          echo "Error: badvpn-tun2socks binary not found sama sekali!"
          exit 1
        fi
        
        echo "Found valid binary at: $BIN_PATH"
        
        # Membuat direktori usr/bin di dalam files passwall-ssh jika belum ada
        mkdir -p package/passwall-ssh/files/usr/bin/
        
        # Copy binary ke dalam passwall-ssh
        cp "$BIN_PATH" package/passwall-ssh/files/usr/bin/badvpn-tun2socks
        chmod +x package/passwall-ssh/files/usr/bin/badvpn-tun2socks
        
        echo "Injection successful!"

    - name: 3. Compile Passwall-SSH (Final APK)
      working-directory: sdk
      run: |
        echo "Compiling Passwall-SSH with injected BadVPN..."
        make package/passwall-ssh/{clean,compile} -j$(nproc) V=s

    - name: Prepare Release Artifacts
      run: |
        mkdir -p release
        
        # Temukan file passwall-ssh.apk yang sudah jadi
        PASSWALL_APK=$(find sdk/bin/packages/ -name "passwall-ssh*.apk" | head -n 1)
        
        if [ -z "$PASSWALL_APK" ]; then
          echo "Error: passwall-ssh APK not found!"
          exit 1
        fi
        
        cp "$PASSWALL_APK" release/
        echo "Build ready:"
        ls -lh release/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: passwall-ssh-with-badvpn-${{ env.ARCH }}
        path: release/*

    - name: Create GitHub Release
      if: success() && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Passwall-SSH (Built-in BadVPN)
        draft: false
        prerelease: false
        make_latest: true
        overwrite_files: true
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}